/* Layout: a single phone-sized app centred on a night-sky stage; on a real phone the app fills the screen. */
:root{

  --display:'Marcellus', Georgia, serif; --body:'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  color-scheme: light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--stage);color:var(--ink);font-family:var(--body);font-size:14px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.stage{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding-block:20px}
.hint{color:var(--soft);font-size:12px;text-align:center;max-width:390px;line-height:1.5}
.hint b{color:var(--gold)}
.phone{position:relative;width:min(390px,100%);height:min(844px, calc(100dvh - 90px));min-height:600px;background:var(--white);border-radius:36px;overflow:hidden;box-shadow:0 0 0 10px #0B0A26, 0 30px 80px rgba(0,0,0,.5);display:flex;flex-direction:column}
@media (max-width:460px){
  body{padding-left:0;padding-right:0}
  .stage{padding-block:0;gap:0;justify-content:flex-start;min-height:0;height:100vh;height:100dvh}
  .hint{display:none}
  .phone{width:100%;height:100vh;height:100dvh;min-height:0;border-radius:0;box-shadow:none}
}
@media (max-height:700px) and (max-width:900px){
  .stage{padding-block:0;gap:0;justify-content:flex-start;min-height:0;height:100vh;height:100dvh}
  .hint{display:none}
  .phone{width:100%;height:100vh;height:100dvh;min-height:0;border-radius:0;box-shadow:none}
}
.scr{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column;background:var(--white)}
.scr.mist{background:var(--mist)}
.scr.dark{background:var(--indigo);color:var(--white)}
.pad{padding:16px 20px 24px;display:flex;flex-direction:column;gap:16px}
.grow{flex:1}
h1,h2,h3,p{margin:0}
.disp{font-family:var(--display);font-weight:400}
.h1{font-family:var(--display);font-weight:400;font-size:28px;line-height:1.2;text-wrap:balance}
.h2{font-family:var(--display);font-weight:400;font-size:20px}
.h3{font-size:15px;font-weight:700}
.muted{color:var(--muted)}
.small{font-size:12px}
.lead{font-size:14px;line-height:1.55;color:var(--muted)}
.topbar{height:52px;display:flex;align-items:center;gap:4px;padding:4px 12px 0 10px;flex:0 0 auto}
.topbar .title{font-family:var(--display);font-size:22px}
.iconbtn{width:44px;height:44px;border:0;background:none;border-radius:22px;display:flex;align-items:center;justify-content:center;color:inherit;cursor:pointer;padding:0;flex:0 0 44px}
.iconbtn:hover{background:rgba(30,27,75,.06)}
.dark .iconbtn:hover,.hdr .iconbtn:hover{background:rgba(255,255,255,.1)}
button,input,textarea,select{font-family:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.btn{height:52px;border-radius:14px;border:0;background:var(--indigo);color:var(--white);font-size:16px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;width:100%;flex:0 0 auto;text-decoration:none}
.btn:hover{background:var(--indigo2)}
.btn.gold{background:var(--gold);color:var(--indigo)}
.btn.ghost{background:none;color:var(--indigo);height:44px;font-size:15px}
.btn.outline{background:var(--white);color:var(--indigo);border:1.5px solid var(--indigo)}
.btn.danger{background:var(--bad)}
.btn.sm{height:40px;font-size:14px;width:auto;padding:0 16px;border-radius:12px}
.btn[disabled]{background:var(--line);color:#8C88A6;cursor:default}
.link{border:0;background:none;color:var(--indigo);font-weight:600;cursor:pointer;padding:8px 0;font-size:13px}
.field{display:flex;flex-direction:column;gap:8px}
.field label,.lbl{font-size:13px;font-weight:600}
.input{height:52px;border:1.5px solid var(--line);border-radius:12px;padding:0 16px;font-size:16px;font-weight:500;color:var(--ink);background:var(--white);width:100%;min-width:0}
.input:focus{border-color:var(--indigo);outline:none}
textarea.input{height:auto;padding:12px 14px;font-size:14px;resize:none;line-height:1.5}
.row{display:flex;gap:10px;align-items:center}
.prefix{height:52px;padding:0 14px;border:1.5px solid var(--line);border-radius:12px;display:flex;align-items:center;font-weight:600;font-size:16px;flex:0 0 auto}
.card{background:var(--white);border:1px solid var(--line);border-radius:18px}
.cardpad{padding:14px 16px}
.list>*+*{border-top:1px solid var(--line2)}
.li{display:flex;align-items:center;gap:12px;padding:12px 14px;min-height:52px;width:100%;border:0;background:none;text-align:left;color:var(--ink);cursor:pointer;font-size:15px}
.li:hover{background:#FAF9FD}
.av{border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;flex:0 0 auto}
.chip{height:38px;padding:0 14px;border-radius:19px;border:1.5px solid var(--line);background:var(--white);font-size:13px;font-weight:600;color:var(--ink);cursor:pointer;flex:0 0 auto;white-space:nowrap}
.chip.on{background:var(--indigo);border-color:var(--indigo);color:var(--white)}
.hscroll{display:flex;gap:8px;overflow-x:auto;padding:0 20px;scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}
.seg{display:grid;gap:4px;background:#E9E6F2;border-radius:12px;padding:4px}
.seg button{height:40px;border:0;border-radius:9px;background:none;font-weight:600;font-size:13px;color:#3E3A5E;cursor:pointer}
.seg button.on{background:var(--white);color:var(--indigo)}

.b-good{background:var(--good-bg);color:#155C39}.b-warn{background:var(--cream);color:var(--gold-ink)}
.note{display:flex;gap:10px;padding:12px 14px;border-radius:12px;background:var(--cream);color:var(--gold-ink);font-size:13px;line-height:1.45}
.note.bad{background:var(--bad-bg);color:#8F1D14;border:1px solid #F4C7C3}
.hdr{background:var(--indigo);color:var(--white);padding:8px 20px 22px;display:flex;flex-direction:column;gap:6px;flex:0 0 auto}
.hdr .topbar{padding:0;margin-left:-10px;height:44px}
.hdr .sub{font-size:13px;color:var(--soft)}
.tabs{background:var(--white);border-bottom:1px solid var(--line);padding:10px 0;flex:0 0 auto;position:sticky;top:0;z-index:2}
.tab{height:38px;padding:0 14px;border-radius:19px;border:0;background:var(--mist);color:#3E3A5E;font-size:13px;font-weight:600;white-space:nowrap;cursor:pointer;flex:0 0 auto}
.tab.on{background:var(--indigo);color:var(--white)}
.tab.all{background:var(--white);border:1.5px solid var(--indigo);color:var(--indigo);display:flex;align-items:center;gap:6px;font-weight:700}
.nav{display:flex;background:var(--white);border-top:1px solid var(--line);padding:6px 8px calc(10px + env(safe-area-inset-bottom, 0px));flex:0 0 auto}
.nav button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:500;color:var(--muted);cursor:pointer;padding:4px 0}
.nav button .pill{width:52px;height:30px;border-radius:15px;display:flex;align-items:center;justify-content:center}
.nav button.on{color:var(--indigo);font-weight:700}
.nav button.on .pill{background:var(--cream)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{min-height:60px;padding:10px 12px;border-radius:16px;background:var(--white);border:1px solid var(--line);display:flex;align-items:center;gap:10px;cursor:pointer;text-align:left;color:var(--ink);font-size:14px;font-weight:600;line-height:1.25}

.otp input:focus{border-color:var(--indigo);outline:none}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:11px 14px;text-align:left}
thead tr{background:#EDEAF7}
thead th{font-size:12px;font-weight:700;color:#3E3A5E}

.toast{position:absolute;left:16px;right:16px;bottom:96px;background:var(--ink);color:var(--white);padding:12px 16px;border-radius:12px;font-size:13px;z-index:30;text-align:center}
.bubble{padding:10px 12px;max-width:80%;font-size:14px;line-height:1.45}
.me{align-self:flex-end;background:var(--indigo);color:var(--white);border-radius:16px 16px 4px 16px}
.them{align-self:flex-start;background:var(--white);border:1px solid var(--line);border-radius:16px 16px 16px 4px}
.splash{flex:1;background:var(--indigo);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;color:var(--white);cursor:pointer;border:0;width:100%;font-family:inherit}

  @keyframes spin{to{transform:rotate(360deg)}}

function fmtTime(v){ if(!v) return ''; const [h,m]=v.split(':').map(Number); if(isNaN(h)) return v; const ap=h>=12?'PM':'AM'; const hh=((h+11)%12)+1; return String(hh).padStart(2,'0')+':'+String(m).padStart(2,'0')+' '+ap; }
function age(v){ const d=new Date(v+'T00:00'); if(isNaN(d)) return ''; const n=new Date('2026-11-18'); let a=n.getFullYear()-d.getFullYear(); if(n<new Date(n.getFullYear(),d.getMonth(),d.getDate())) a--; return a>=0&&a<130? a+' yrs':''; }

chat(){ const a = ASTRO.find(x=>x.id===S.chatAstro); const mins = Math.max(1, Math.round((Date.now()-S.chatStart)/60000)); return `<header class="row" style="background:var(--indigo);color:#fff;padding:10px 14px;gap:10px;flex:0 0 auto">${av(a.name,42,ASTRO.indexOf(a))}<div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:2px"><b style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(a.name)}</b><span class="small num" style="color:var(--gold)">● Live · ₹${a.price}/min · text only</span></div><button class="btn danger sm" style="height:38px;border-radius:19px;font-size:13px" data-act="endchat">End</button></header>
  <div class="scr mist" id="chatlog" style="padding:14px;gap:10px"><span class="small muted" style="align-self:center;background:#EDEAF7;padding:4px 12px;border-radius:12px">Session started · text only</span>
  ${S.chat.map(m=> m.blocked ? `<div role="alert" class="note bad" style="align-self:flex-end;max-width:88%">${ic('info',16)}<span>Message not sent. Sharing phone numbers, emails, links or offensive words isn’t allowed.</span></div>` : `<div class="bubble ${m.me?'me':'them'}">${esc(m.text)}</div>`).join('')}</div>
  <form class="row" id="chatform" style="background:#fff;border-top:1px solid var(--line);padding:10px 12px calc(14px + env(safe-area-inset-bottom,0px));gap:8px;flex:0 0 auto"><label for="msg" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Message</label><input id="msg" class="input" autocomplete="off" placeholder="Type your question…" style="height:48px;border-radius:24px;background:var(--mist)"><button class="iconbtn" type="submit" aria-label="Send" style="background:var(--indigo);color:var(--gold);width:48px;height:48px;flex:0 0 48px">${ic('send',20)}</button></form>`; },

summary(){ const d = S.dues || {name:'Acharya Raghav Sharma', mins:12, rate:15, amount:180}; return `<div class="scr mist"><div class="pad grow" style="padding:40px 20px 24px">
  <div style="display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center">${av(d.name,80,ASTRO.findIndex(x=>x.name===d.name))}<h1 class="h1" style="font-size:26px">Session ended</h1><p class="lead">with ${esc(d.name)}</p></div>
  <section class="card" style="padding:4px 16px"><h2 class="h3" style="margin:12px 0 4px">Fee summary</h2>${[['Duration',d.mins+' min'],['Rate','₹'+d.rate+' / min'],['Gateway charges','[TBD]']].map(([k,v])=>`<div class="row" style="justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line2)"><span class="muted">${k}</span><b>${v}</b></div>`).join('')}<div class="row" style="justify-content:space-between;padding:14px 0;font-size:17px"><b>Total</b><b>₹${d.amount}</b></div></section>
  <div class="note" role="note">${ic('info',18)}<span>Payments are non-refundable. Until this is paid you can’t book another session.</span></div>
  <span class="grow"></span><button class="btn" data-act="pay">${ic('lock',18,'style="color:var(--gold)"')}Pay ₹${d.amount} securely</button><span class="small muted" style="text-align:center">UPI, cards, net banking and wallets via the payment gateway</span><button class="btn ghost" data-act="paylater">Pay later</button></div></div>`; },

rate(){ const words=['','Poor','Fair','Good','Very good','Excellent']; return `<div class="scr mist"><div class="pad grow" style="padding:36px 20px 24px">
  <div style="display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center"><span class="av" style="width:72px;height:72px;background:var(--good-bg);color:var(--good)">${ic('check',36)}</span><h1 class="h1" style="font-size:26px">Payment successful</h1><p class="lead">₹${S.lastPaid?.amount||180} paid</p><button class="chip row" style="gap:6px" data-act="toast" data-msg="Invoice downloaded (prototype)">${ic('download',16)}Download invoice</button></div>
  <section class="card" style="padding:18px;display:flex;flex-direction:column;gap:12px"><div><h2 class="h3" style="font-size:17px">Rate your session</h2><span class="small muted">with ${esc(S.lastPaid?.name||'')}</span></div>
  <div class="row" role="radiogroup" aria-label="Rating out of 5" style="gap:4px">${[1,2,3,4,5].map(n=>`<button class="iconbtn" role="radio" aria-checked="${n===S.rating}" aria-label="${n} star${n>1?'s':''}" data-rate="${n}" style="width:48px;height:48px">${star(n<=S.rating?'#E8A317':'#E6E2F0',36)}</button>`).join('')}</div><b>${S.rating} / 5 · ${words[S.rating]}</b>
  <div class="field"><label for="review">Review <span class="muted" style="font-weight:400">(optional)</span></label><textarea class="input" id="review" rows="3" placeholder="What was helpful?"></textarea><span class="small muted">Reviews with offensive words can’t be posted.</span></div></section>
  <span class="grow"></span><button class="btn" data-act="submitreview">Submit review</button><button class="btn ghost" data-act="skiprate">Skip</button></div></div>`; },

chats(){ const items = S.history; return `<div class="scr mist"><div class="pad" style="padding-top:20px"><h1 class="h1">Chats</h1>
  ${S.guest?`<div class="card cardpad" style="display:flex;flex-direction:column;gap:12px;align-items:flex-start"><p class="lead">Log in to see your past consultations.</p><button class="btn sm" data-go="login">Log in</button></div>`:''}
  ${S.dues?`<button class="note" style="border:0;text-align:left;cursor:pointer" data-go="summary">${ic('info',20)}<span style="flex:1"><b>₹${S.dues.amount} unpaid</b> for your session with ${esc(S.dues.name)}. Pay to book again.</span><b>Pay</b></button>`:''}
  ${!S.guest? (items.length? items.map(h=>{ const a=ASTRO.find(x=>x.id===h.astro); return `<button class="card" data-pastchat="${S.history.indexOf(h)}" style="padding:14px;display:flex;gap:12px;text-align:left;cursor:pointer;color:var(--ink)">${av(a.name,48,ASTRO.indexOf(a))}<span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:4px"><span class="row" style="justify-content:space-between"><b style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(a.name)}</b><span class="small muted">${h.date}</span></span><span class="small muted" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(h.last)}</span><span class="row small" style="gap:8px"><span class="muted">${h.mins} min · ₹${h.amount}</span><span class="badge ${h.paid?'b-good':'b-warn'}">${h.paid?'Paid':'Due'}</span>${h.rated?'<span class="muted">★ Rated</span>':''}</span></span></button>`; }).join('') : `<p class="lead">No chats yet. Find an astrologer to start one.</p>`) : ''}
</div></div>${nav('chats')}`; },

pastChat(){ const h=S.history[S.pastIdx]; const a=ASTRO.find(x=>x.id===h.astro); return `<div class="scr mist">${topbar(a.name)}<div style="padding:8px 16px 20px;display:flex;flex-direction:column;gap:10px"><span class="small muted" style="align-self:center;background:#EDEAF7;padding:4px 12px;border-radius:12px">${h.date} · ${h.mins} min · read-only</span>${(h.msgs||[{me:true,text:'Namaste, I have a question about my chart.'},{me:false,text:'Namaste. Please go ahead.'},{me:false,text:h.last}]).map(m=>`<div class="bubble ${m.me?'me':'them'}">${esc(m.text)}</div>`).join('')}</div></div>`; },

kundli(){ const f=S.kform; return `<div class="scr mist">${topbar('Generate Kundli')}<div class="pad" style="padding-top:4px">
  <form class="card" id="kform" style="padding:20px 16px;display:flex;flex-direction:column;gap:16px">
  <div class="field"><label for="kname">Name</label><input class="input" id="kname" placeholder="Full name" data-model="kform.name" value="${esc(f.name)}"></div>
  <fieldset style="border:0;margin:0;padding:0;display:flex;flex-direction:column;gap:8px"><legend class="lbl" style="padding:0;margin-bottom:8px">Gender</legend><div class="seg" role="radiogroup" style="grid-template-columns:1fr 1fr">${['Male','Female'].map(g=>`<button type="button" role="radio" aria-checked="${g===f.gender}" class="${g===f.gender?'on':''}" data-gender="${g}" style="height:44px">${g}</button>`).join('')}</div></fieldset>
  <div class="grid2" style="gap:12px"><div class="field"><label for="kdob">Date of birth</label><input class="input" id="kdob" type="date" data-model="kform.dob" value="${esc(f.dob)}" style="padding:0 10px;font-size:15px"></div><div class="field"><label for="ktime">Birth time</label><input class="input" id="ktime" type="time" data-model="kform.time" value="${esc(f.time)}" style="padding:0 10px;font-size:15px"></div></div>
  <div class="field"><span class="lbl">Birth place</span><button type="button" class="input row" data-go="place" style="gap:10px;text-align:left;cursor:pointer;color:${f.place?'var(--ink)':'#6F6B8C'};font-size:15px"><span class="muted">${ic('search',18)}</span>${esc(f.place||'Search city in India')}</button></div>
  <button type="button" class="btn" data-act="proceedKundli">Proceed</button></form>
  <section style="display:flex;flex-direction:column;gap:10px"><h2 class="h2">Saved Kundlis</h2>${allProfiles().map((p,i)=>`<button class="card" data-openprofile="${i}" style="padding:12px 14px;display:flex;align-items:center;gap:12px;text-align:left;cursor:pointer;color:var(--ink)"><span class="av" style="width:44px;height:44px;background:#EDEAF7;color:var(--indigo)">${initials(p.name)}</span><span style="flex:1;display:flex;flex-direction:column;gap:2px"><b>${esc(p.name)}</b><span class="small muted">${esc(p.dob)} · ${esc(p.time)} · ${esc(p.place)}</span></span><span class="muted">${ic('next',20)}</span></button>`).join('')}</section></div></div>`; },

place(){ const q=S.placeQuery.trim().toLowerCase(); const list = (q?PLACES.filter(([c])=>c.toLowerCase().startsWith(q)):PLACES).slice(0,8); return `<div class="scr">${topbar('Birth place')}<div class="pad" style="padding-top:4px;gap:12px">
  <label class="input row" style="gap:10px;border-color:var(--indigo)"><span>${ic('search',20)}</span><span style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Search city in India</span><input id="psearch" type="search" placeholder="Search city in India" data-model="placeQuery" data-rerender="1" value="${esc(S.placeQuery)}" style="border:0;outline:none;flex:1;min-width:0;font-size:16px;font-weight:500;background:none;color:var(--ink)"></label>
  <p class="small muted">Places in India only.${q&&!list.length?' No match. Tap below to use what you typed.':''}</p>
  <ul role="listbox" aria-label="Suggestions" style="list-style:none;margin:0;padding:0" class="list">${list.map(([c,s])=>`<li role="option" aria-selected="false"><button class="li" data-place="${esc(c)}, ${esc(s)}"><span class="av" style="width:40px;height:40px;background:var(--mist);color:var(--muted)">${ic('pin',18)}</span><span style="display:flex;flex-direction:column;gap:2px"><span><b>${esc(c.slice(0,q.length))}</b>${esc(c.slice(q.length))}</span><span class="small muted">${esc(s)}, India</span></span></button></li>`).join('')}${q&&!list.length?`<li><button class="li" data-place="${esc(S.placeQuery)}"><span class="av" style="width:40px;height:40px;background:var(--mist);color:var(--muted)">${ic('pin',18)}</span>Use “${esc(S.placeQuery)}”</button></li>`:''}</ul></div></div>`; },

kundliView(){ return `<div class="scr mist">${kundliHeader()}${kundliTabs()}<div class="pad" style="padding-top:18px">${KVIEW[S.kTab] ? KVIEW[S.kTab]() : KVIEW._generic()}</div></div>`; },

panchang(){ return `<div class="scr mist">${topbar('Panchang')}<div class="pad" style="padding-top:4px">${PANCHANG()}</div></div>`; },

horoscope(){ const P={Daily:['Today','18 Nov 2026'],Weekly:['This week','16 – 22 Nov 2026'],Monthly:['This month','November 2026'],Yearly:['This year','2026']};
  const SG=[['Aries','♈','21 Mar – 19 Apr'],['Taurus','♉','20 Apr – 20 May'],['Gemini','♊','21 May – 20 Jun'],['Cancer','♋','21 Jun – 22 Jul'],['Leo','♌','23 Jul – 22 Aug'],['Virgo','♍','23 Aug – 22 Sep'],['Libra','♎','23 Sep – 22 Oct'],['Scorpio','♏','23 Oct – 21 Nov'],['Sagittarius','♐','22 Nov – 21 Dec'],['Capricorn','♑','22 Dec – 19 Jan'],['Aquarius','♒','20 Jan – 18 Feb'],['Pisces','♓','19 Feb – 20 Mar']];
  const s=SG[S.horoSign]; return `<div class="scr mist">${topbar('Horoscope')}<div style="display:flex;flex-direction:column;gap:16px;padding:4px 0 24px">
  <div class="seg" role="tablist" style="grid-template-columns:repeat(4,minmax(0,1fr));margin:0 20px">${Object.keys(P).map(k=>`<button role="tab" aria-selected="${k===S.horoPeriod}" class="${k===S.horoPeriod?'on':''}" data-period="${k}">${k}</button>`).join('')}</div>
  <div class="hscroll" role="radiogroup" aria-label="Zodiac sign" style="gap:10px">${SG.map(([n,g],i)=>`<button role="radio" aria-checked="${i===S.horoSign}" data-sign="${i}" style="flex:0 0 64px;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;font-size:12px;font-weight:600;color:var(--ink);padding:0"><span style="width:56px;height:56px;border-radius:28px;display:flex;align-items:center;justify-content:center;font-size:24px;${i===S.horoSign?'background:var(--indigo);color:var(--gold)':'background:#fff;border:1px solid var(--line);color:var(--indigo)'}">${g}&#xFE0E;</span>${n}</button>`).join('')}</div>
  <section style="margin:0 20px;background:var(--indigo);color:#fff;border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:6px"><span class="small" style="color:var(--gold);font-weight:600">${P[S.horoPeriod][0]} · ${P[S.horoPeriod][1]}</span><span class="disp" style="font-size:26px">${s[0]}</span><span class="small" style="color:var(--soft)">${s[2]}</span></section>
  ${['Overview','Love & relationships','Career & money','Health'].map(t=>`<section class="card cardpad" style="margin:0 20px;display:flex;flex-direction:column;gap:6px"><h2 class="h3">${t}</h2><p style="font-size:14px;line-height:1.55;color:#6F6B8C;font-style:italic">[${t} text — content source to be confirmed]</p></section>`).join('')}</div></div>`; },

profile(){ if(S.guest) return `<div class="scr mist"><div class="pad grow" style="padding-top:20px"><h1 class="h1">Profile</h1><div class="card" style="padding:20px;display:flex;flex-direction:column;gap:12px"><p class="lead">You’re browsing as a guest. Log in to save birth profiles, chat with astrologers and buy reports.</p><button class="btn" data-go="login">Log in with mobile number</button></div><div class="card list" style="overflow:hidden">${[['Grievance & support','grievance','help']].map(([l,r,i])=>`<button class="li" data-go="${r}">${ic(i,20)}<span style="flex:1">${l}</span><span class="muted">${ic('next',18)}</span></button>`).join('')}</div></div></div>${nav('profile')}`;
  const G=[['Account',[['Edit profile','editProfile','edit'],['Birth profiles','birthProfiles','family']]],['Activity',[['Chat history','@chats','chat'],['Transactions & invoices','transactions','card'],['My reports','@myreports','doc']]],['Help',[['Grievance & support','grievance','help']]],['',[['Delete my account','deleteAccount','trash']]]];
  return `<div class="scr mist"><div class="pad" style="padding-top:20px;gap:18px"><h1 class="h1">Profile</h1>
  <button data-go="editProfile" style="background:var(--indigo);color:#fff;border:0;border-radius:20px;padding:16px;display:flex;align-items:center;gap:14px;text-align:left;cursor:pointer"><span class="av" style="width:56px;height:56px;background:var(--gold);color:var(--indigo);font-size:18px">${initials(me())}</span><span style="flex:1;display:flex;flex-direction:column;gap:2px"><span class="disp" style="font-size:20px">${esc(me())}</span><span class="small" style="color:var(--soft)">+91 ${esc(S.user.phone||'98765 43210')}</span></span><b style="color:var(--gold);font-size:13px">Edit</b></button>
  ${G.map(([t,items])=>`<section style="display:flex;flex-direction:column;gap:8px">${t?`<h2 class="small muted" style="margin:0 4px;font-weight:700;letter-spacing:.6px;text-transform:uppercase">${t}</h2>`:''}<div class="card list" style="overflow:hidden">${items.map(([l,r,i])=>`<button class="li" data-go="${r}" style="${r==='deleteAccount'?'color:var(--bad)':''}">${ic(i,20)}<span style="flex:1">${l}</span><span class="muted">${ic('next',18)}</span></button>`).join('')}</div></section>`).join('')}
  <button class="btn outline" data-act="logout">Log out</button></div></div>${nav('profile')}`; },

editProfile(){ return `<div class="scr">${topbar('Edit profile')}<div class="pad grow" style="padding:8px 24px 28px;gap:20px">
  <div style="display:flex;flex-direction:column;align-items:center;gap:6px"><span class="av" style="width:90px;height:90px;background:var(--gold);color:var(--indigo);font-size:28px">${initials(me())}</span><button class="link" data-act="toast" data-msg="Photo picker opens here">Change photo</button></div>
  <div class="field"><label for="ename">Name</label><input class="input" id="ename" data-model="user.name" value="${esc(S.user.name)}"></div>
  <div class="field"><label for="edob">Date of birth</label><input class="input" id="edob" type="date" data-model="user.dob" value="${esc(S.user.dob)}"></div>
  <div class="field"><span class="lbl">Mobile number</span><div class="row input" style="background:var(--mist);justify-content:space-between;padding-right:6px"><span>+91 ${esc(S.user.phone||'98765 43210')}</span><button class="link" data-go="editMobile" style="padding:12px 10px;font-size:14px">Change</button></div><span class="small muted">Changing your number needs OTP verification.</span></div>
  <span class="grow"></span><button class="btn" data-act="saveProfile">Save changes</button></div></div>`; },

editMobile(){ return `<div class="scr">${topbar('Change mobile number')}<div class="pad grow" style="padding:8px 24px 28px;gap:20px">
  <p class="lead">We’ll send an OTP to your new number. Your number changes only after it’s verified.</p>
  <div class="field"><span class="lbl">Current number</span><div class="input row" style="background:var(--mist);border-color:var(--mist);color:var(--muted)">+91 ${esc(S.user.phone||'98765 43210')}</div></div>
  <div class="field"><label for="newphone">New mobile number</label><div class="row"><span class="prefix">+91</span><input class="input" id="newphone" type="tel" inputmode="numeric" placeholder="Any number works" data-model="newPhone" value="${esc(S.newPhone||'')}"></div></div>
  <span class="grow"></span><button class="btn" data-act="changeotp">Send OTP</button></div></div>`; },

birthProfiles(){ const all=allProfiles(); return `<div class="scr mist">${topbar('Birth profiles')}<div class="pad" style="padding-top:4px">
  <p class="lead">Save charts for yourself and family. The selected profile is used for Kundli and Dasha.</p>
  <div role="radiogroup" aria-label="Active birth profile" style="display:flex;flex-direction:column;gap:10px">${all.map((p,i)=>`<button role="radio" aria-checked="${i===S.activeProfile}" data-pick-profile="${i}" class="card" style="padding:14px;display:flex;align-items:center;gap:14px;text-align:left;cursor:pointer;color:var(--ink);border:2px solid ${i===S.activeProfile?'var(--indigo)':'var(--line)'}"><span aria-hidden="true" style="width:22px;height:22px;border-radius:11px;border:2px solid ${i===S.activeProfile?'var(--indigo)':'#B9B3D6'};display:flex;align-items:center;justify-content:center;flex:0 0 22px"><span style="width:10px;height:10px;border-radius:5px;background:${i===S.activeProfile?'var(--indigo)':'transparent'}"></span></span><span style="flex:1;display:flex;flex-direction:column;gap:3px"><b>${esc(p.name)} <span class="small muted" style="font-weight:500">· ${esc(p.rel)}</span></b><span class="small muted">${esc(p.dob)} · ${esc(p.time)} · ${esc(p.place)}</span></span></button>`).join('')}</div>
  <button class="btn outline" style="border-style:dashed" data-act="newprofile">${ic('plus',18)}Add birth profile</button>
  <button class="btn" data-act="openActiveKundli">Open Kundli for ${esc(all[S.activeProfile].name.split(' ')[0])}</button></div></div>`; },

transactions(){ const keep=t=>S.txFilter==='All'||(S.txFilter==='Consultations'&&t.kind==='c')||(S.txFilter==='Reports'&&t.kind==='r'); const months=[...new Set(S.tx.map(t=>t.month))]; return `<div class="scr mist">${topbar('Transactions')}<div class="pad" style="padding-top:4px">
  <div class="row" role="tablist">${['All','Consultations','Reports'].map(l=>`<button class="chip ${l===S.txFilter?'on':''}" role="tab" aria-selected="${l===S.txFilter}" data-txf="${l}">${l}</button>`).join('')}</div>
  ${S.dues?`<div class="card row" style="padding:12px 14px;gap:12px"><span class="av" style="width:40px;height:40px;border-radius:12px;background:var(--cream);color:#8A5300">${ic('chat',20)}</span><span style="flex:1;display:flex;flex-direction:column;gap:2px"><b>${esc(S.dues.name)}</b><span class="small muted">${S.dues.mins} min chat · unpaid</span></span><span style="display:flex;flex-direction:column;align-items:flex-end"><b>₹${S.dues.amount}</b><button class="link" style="color:#8A5300" data-go="summary">Pay now</button></span></div>`:''}
  ${months.map(m=>{ const items=S.tx.filter(t=>t.month===m&&keep(t)); if(!items.length) return ''; return `<section style="display:flex;flex-direction:column;gap:8px"><h2 class="small muted" style="margin:0 4px;font-weight:700;letter-spacing:.6px;text-transform:uppercase">${m}</h2><div class="card list" style="overflow:hidden">${items.map(t=>`<div class="row" style="padding:10px 14px;gap:12px"><span class="av" style="width:40px;height:40px;border-radius:12px;${t.kind==='c'?'background:#EDEAF7;color:var(--indigo)':'background:var(--cream);color:#8A5300'}">${ic(t.kind==='c'?'chat':'doc',20)}</span><span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:2px"><b style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(t.title)}</b><span class="small muted">${esc(t.sub)}</span></span><span style="display:flex;flex-direction:column;align-items:flex-end"><b>₹${t.amount}</b><button class="link row" style="gap:4px;font-size:12px" data-act="toast" data-msg="Invoice downloaded (prototype)">${ic('download',14)}Invoice</button></span></div>`).join('')}</div></section>`; }).join('')}
  <p class="small muted" style="text-align:center">All payments are non-refundable.</p></div></div>`; },

/* ---------- render ---------- */
function render(scrollTop){
  const name = cur();
  const fn = SCREENS[name] || SCREENS.home;
  const keep = !scrollTop && document.activeElement && document.activeElement.id ? {id:document.activeElement.id, s:document.activeElement.selectionStart} : null;
  const sc = $phone.querySelector('.scr'); const prevScroll = sc && !scrollTop ? sc.scrollTop : 0;
  $phone.innerHTML = fn() + (S.sheet && SHEETS[S.sheet] ? SHEETS[S.sheet]() : '') + (S.toast ? `<div class="toast" role="status">${esc(S.toast)}</div>` : '');
  const nsc = $phone.querySelector('.scr'); if(nsc) nsc.scrollTop = prevScroll;
  if(name==='chat'){ const log=document.getElementById('chatlog'); if(log) log.scrollTop=log.scrollHeight; }
  if(name==='kundliView'){ const t=$phone.querySelector('#ktabs .tab.on'); if(t) t.scrollIntoView({block:'nearest',inline:'center'}); }
  if(keep){ const el=document.getElementById(keep.id); if(el){ el.focus(); try{ if(keep.s!=null) el.setSelectionRange(keep.s,keep.s);}catch(e){} } }
  if(scrollTop){ const h = name; try{ if(location.hash.slice(1)!==h) history.replaceState(null,'','#'+h); }catch(e){} }
}

/* ---------- actions ---------- */
function setPath(path, val){ const parts=path.split('.'); let o=S; while(parts.length>1) o=o[parts.shift()]; o[parts[0]]=val; }
function consult(id){ S.astroId=id; S.chatAstro=id; if(S.guest){ S.sheet='login'; render(); return; } if(S.dues){ S.sheet='dues'; render(); return; } go('waiting'); clearTimeout(consult.t); consult.t=setTimeout(()=>{ if(cur()==='waiting'){ const a=ASTRO.find(x=>x.id===S.chatAstro); S.chat=[{me:false,text:`Namaste ${S.user.name?S.user.name.split(' ')[0]:''}. I have your Kundli open — Leo ascendant, Moon in Aquarius. How can I help?`}]; S.chatStart=Date.now(); go('chat',true);} },2600); }
const REPLIES=['Let me look at your 10th house and the current dasha…','You are in Jupiter mahadasha with Venus antardasha until March 2028.','April onwards looks more supportive for this. Plan from then.','Keep the conversation here on the app, please. Anything else?'];
function sendMsg(text){ text=text.trim(); if(!text) return; const bad=/(\d[\s-]?){7,}|@|https?:\/\/|www\.|\.com\b|whatsapp|telegram|call me/i.test(text); if(bad){ S.chat.push({blocked:true}); render(); return; } S.chat.push({me:true,text}); render(); const n=S.chat.filter(m=>m.me).length; setTimeout(()=>{ if(cur()!=='chat') return; S.chat.push({me:false,text:REPLIES[(n-1)%REPLIES.length]}); render(); },1100); }
function endChat(){ const a=ASTRO.find(x=>x.id===S.chatAstro); const mins=Math.max(3, Math.round((Date.now()-S.chatStart)/60000)+S.chat.length); S.dues={name:a.name, astro:a.id, mins, rate:a.price, amount:mins*a.price, msgs:S.chat.filter(m=>!m.blocked)}; go('summary',true); }

$phone.addEventListener('click', e=>{
  const stop = e.target.closest('[data-stop]'); const el = e.target.closest('[data-go],[data-go-replace],[data-act],[data-tab],[data-astro],[data-consult],[data-filter-chip],[data-sort],[data-ktab],[data-dasha],[data-period],[data-sign],[data-gender],[data-place],[data-openprofile],[data-pick-profile],[data-txf],[data-rtab],[data-report],[data-rate],[data-pastchat]');
  if(!el) return;
  if(stop && el.matches('.sheetwrap')) return;
  const d = el.dataset;
  if(d.go){ if(d.go==='@chats') return tabRoot('chats'); if(d.go==='@myreports'){ S.reportsTab='My reports'; return go('reports'); } if(d.go==='planetsQuick'){ S.kTab='Planets'; return go('kundliView'); } return go(d.go); }
  if(d.goReplace) return go(d.goReplace, true);
  if(d.tab) return tabRoot(d.tab);
  if(d.astro){ S.astroId=d.astro; return go('astroProfile'); }
  if(d.consult) return consult(d.consult);
  if(d.filterChip){ S.astroFilter=d.filterChip; return render(); }
  if(d.sort){ S.astroSort=d.sort; S.sheet=null; return render(); }
  if(d.ktab){ S.kTab=d.ktab; if(cur()!=='kundliView') return go('kundliView'); return render(true); }
  if(d.dasha){ S.dasha=d.dasha; return render(); }
  if(d.period){ S.horoPeriod=d.period; return render(); }
  if(d.sign){ S.horoSign=+d.sign; return render(); }
  if(d.gender){ S.kform.gender=d.gender; return render(); }
  if(d.place){ S.kform.place=d.place; S.placeQuery=''; return back(); }
  if(d.openprofile){ S.activeProfile=+d.openprofile; S.kTab='Overview'; return go('kundliView'); }
  if(d.pickProfile){ S.activeProfile=+d.pickProfile; return render(); }
  if(d.txf){ S.txFilter=d.txf; return render(); }
  if(d.rtab){ S.reportsTab=d.rtab; return render(); }
  if(d.report){ S.reportId=d.report; S.reportFor=0; if(S.guest){ S.sheet='login'; return render(); } return go('reportDetail'); }
  if(d.rate){ S.rating=+d.rate; return render(); }
  if(d.pastchat){ S.pastIdx=+d.pastchat; return go('pastChat'); }
  switch(d.act){
    case 'back': return back();
    case 'toast': return toast(d.msg);
    case 'skip': S.guest=true; S.stack=['home']; return render(true);
    case 'getotp': S.otpFor='login'; return go('otp');
    case 'verify': if(S.otpFor==='change'){ S.user.phone=S.newPhone||S.user.phone; S.stack=S.stack.filter(x=>x!=='otp'&&x!=='editMobile'); toast('Mobile number updated'); return render(true); } S.guest=false; S.user.phone=S.pendingPhone||'98765 43210'; if(S.newUser){ S.stack=['consent']; return render(true);} S.stack=['home']; return render(true);
    case 'finishOnboarding': if(!S.user.name) S.user.name='Ananya Verma'; S.newUser=false; S.stack=['home']; return render(true);
    case 'service': S.astroFilter=d.filter; return tabRoot('astrologers');
    case 'sortsheet': S.sheet='sort'; return render();
    case 'closesheet': if(e.target.closest('[data-stop]') && !e.target.closest('.sheet [data-act="closesheet"]')) return; S.sheet=null; return render();
    case 'endchat': return endChat();
    case 'pay': { const d2=S.dues||{name:'Acharya Raghav Sharma',astro:'rs',mins:12,rate:15,amount:180}; S.lastPaid=d2; S.history.unshift({astro:d2.astro||'rs', date:'Today', mins:d2.mins, amount:d2.amount, paid:true, rated:false, last:(d2.msgs&&d2.msgs.length?d2.msgs[d2.msgs.length-1].text:'Thank you.'), msgs:d2.msgs}); S.tx.unshift({title:d2.name, sub:'Today · '+d2.mins+' min chat', amount:d2.amount, kind:'c', month:'November 2026'}); S.dues=null; S.rating=5; return go('rate',true); }
    case 'paylater': { const d2=S.dues; if(d2 && !S.history.find(h=>h.unpaid)) S.history.unshift({astro:d2.astro, date:'Today', mins:d2.mins, amount:d2.amount, paid:false, unpaid:true, last:(d2.msgs&&d2.msgs.length?d2.msgs[d2.msgs.length-1].text:''), msgs:d2.msgs}); S.stack=['home']; toast('Saved as unpaid. Pay before your next session.'); return render(true); }
    case 'submitreview': { const h=S.history[0]; if(h) h.rated=true; toast('Thanks! Your review is on the astrologer’s profile.'); S.stack=['chats']; return render(true); }
    case 'skiprate': S.stack=['home']; return render(true);
    case 'proceedKundli': S.activeProfile=0; S.kTab='Overview'; return go('kundliView');
    case 'saveProfile': toast('Profile saved'); return back();
    case 'changeotp': S.otpFor='change'; S.pendingPhone=S.newPhone||''; return go('otp');
    case 'newprofile': S.sheet='newprofile'; return render();
    case 'openActiveKundli': S.kTab='Overview'; return go('kundliView');
    case 'buyreport': { const r=REPORTS.find(x=>x.id===S.reportId); const p=allProfiles()[S.reportFor]; S.myReports.unshift({id:r.id, for:p.name, ready:false, date:'today'}); S.tx.unshift({title:r.title, sub:'Today · report', amount:r.price, kind:'r', month:'November 2026'}); S.reportsTab='My reports'; S.stack.pop(); toast('Payment done. Your report is being generated.'); render(true); setTimeout(()=>{ S.myReports[0].ready=true; if(cur()==='reports') render(); },3500); return; }
    case 'copyemail': try{ navigator.clipboard.writeText('grievance@astroapp.in').then(()=>toast('Email address copied'),()=>toast('Select the address to copy it')); }catch(err){ toast('Select the address to copy it'); } return;
    case 'deleteacc': S.guest=true; S.user={name:'',phone:'',dob:''}; S.newUser=true; S.history=[]; S.myReports=[]; S.dues=null; S.delOk=false; S.stack=['login']; toast('Account deleted'); return render(true);
    case 'logout': S.guest=true; S.stack=['login']; return render(true);
  }
});
$phone.addEventListener('input', e=>{
  const el=e.target;
  if(el.dataset.model){ setPath(el.dataset.model, el.value); if(el.dataset.rerender) render(); }
  if(el.dataset.otp){ if(el.value && el.nextElementSibling) el.nextElementSibling.focus(); }
});
$phone.addEventListener('change', e=>{
  const el=e.target;
  if(el.dataset.check){ S[el.dataset.check]=el.checked; }
  if(el.dataset.rfor!=null){ S.reportFor=+el.dataset.rfor; render(); }
  if(el.dataset.model && el.dataset.rerender) render();
});
$phone.addEventListener('keydown', e=>{ if(e.key==='Backspace' && e.target.dataset.otp && !e.target.value && e.target.previousElementSibling) e.target.previousElementSibling.focus(); });
$phone.addEventListener('submit', e=>{
  e.preventDefault();
  if(e.target.id==='chatform'){ const i=e.target.querySelector('#msg'); const v=i.value; i.value=''; sendMsg(v); setTimeout(()=>{ const m=document.getElementById('msg'); if(m) m.focus(); },0); }
  if(e.target.id==='npform'){ const g=id=>(document.getElementById(id)||{}).value||''; S.profiles.push({name:g('npname')||'New profile', rel:g('nprel')||'Family', dob:fmtDate(g('npdob'))||'—', time:fmtTime(g('nptime'))||'—', place:g('npplace')||'—'}); S.activeProfile=S.profiles.length; S.sheet=null; toast('Birth profile added'); render(); }
});

/* start */
const startHash = location.hash.slice(1);
if(startHash && ROUTES.has(startHash) && startHash!=='splash'){ S.guest=false; S.newUser=false; S.user={name:'Ananya Verma', phone:'98765 43210', dob:'1996-08-14'}; S.stack=['home']; if(startHash!=='home') S.stack.push(startHash); }
render(true);
if(cur()==='splash') setTimeout(()=>{ if(cur()==='splash') go('login',true); },1800);
})();
</script>

</body></html>
